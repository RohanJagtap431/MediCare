
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MediCare</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #172554, #1e3a8a);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 38px 32px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            width: 62px;
            height: 62px;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: #2563eb;
            color: white;
            font-size: 32px;
            font-weight: bold;
        }

        .brand h1 {
            color: #172033;
            font-size: 27px;
            margin-bottom: 7px;
        }

        .brand p {
            color: #64748b;
            font-size: 14px;
        }

        .login-title {
            margin-bottom: 23px;
        }

        .login-title h2 {
            font-size: 21px;
            color: #172033;
            margin-bottom: 6px;
        }

        .login-title p {
            font-size: 13px;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 19px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
        }

        .form-group input {
            width: 100%;
            height: 47px;
            padding: 12px 14px;
            border: 1px solid #dbe2ea;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }

        .login-btn {
            width: 100%;
            height: 47px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 17px;
            font-size: 13px;
        }

        .alert-error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .alert-success {
            background: #dcfce7;
            color: #15803d;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 12px;
        }

        @media(max-width:480px) {
            .login-container {
                padding: 30px 22px;
            }

            .brand h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="brand">

            <div class="brand-icon">+</div>

            <h1>MediCare</h1>

            <p>Medical Store Management System</p>

        </div>


        <div class="login-title">

            <h2>Welcome Back!</h2>

            <p>Sign in to access your account.</p>

        </div>


        {% if messages %}
            {% for message in messages %}

                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>

            {% endfor %}
        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <input
                type="hidden"
                name="next"
                value="{{ request.GET.next|default:'' }}"
            >

            <div class="form-group">

                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                    autofocus
                >

            </div>


            <div class="form-group">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button type="submit" class="login-btn">
                Sign In
            </button>

        </form>


        <div class="footer">
            © 2026 MediCare. All rights reserved.
        </div>

    </div>

</body>
</html>
